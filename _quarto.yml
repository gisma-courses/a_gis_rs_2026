project:
  type: website
  output-dir: docs/
  resources:
    - "assets/Archive.zip"
    - "scripts/microclimate_warmup_minimal.R"
    
  
  render:
    - "index.qmd"
    - "pages/**/*.qmd"
    - "slides/*.qmd"
    - "scripts/*.R"

website:
  title: "R-spatial in a nutshell"
  favicon: /images/logo.png
  bread-crumbs: false
  open-graph: true
  page-navigation: true
  site-url: https://gisma-courses.github.io/a_gis_rs_2026
  repo-url: https://github.com/gisma-courses/a_gis_rs_2026
  repo-actions: [edit, issue]
  repo-branch: main

  search:
    location: navbar
    type: textbox

  twitter-card:
    creator: "@gisma"

  comments: false

  # navbar:
  #   logo: /images/logo.png
