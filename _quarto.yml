      style: "docked"
      collapse-level: 1
      pinned: true
      contents:
        - href: index.qmd
          text: Start
        - text: "---"
        - section: "Inhalte"
          contents:
            - href: pages/
              text: Kursstruktur
        - text: "---"
        - section: "Worksheets"
          contents:
