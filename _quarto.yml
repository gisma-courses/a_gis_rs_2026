              text: Mikroklima-Warmup Foliensatz

execute:
  freeze: auto
  echo: false
  message: false
  warning: false
  cache: false

format:
  html:
    code-overflow: wrap
    toc-title: "Inhalt"
    number-sections: false
    highlight-style: github
    theme:
      light: cerulean
      dark: lumen
    code-copy: true
    toc: true
    link-external-icon: false
    link-external-newwindow: true

  revealjs:
    theme:
      - default
      - metropolis.scss
    slide-number: true
    transition: fade
    incremental: false